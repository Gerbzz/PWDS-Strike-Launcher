name: UI local fixture validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-fixture:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check fixture CLI and normal installer transactions
        run: cargo test --locked --features native-ui,ui-local-fixture --test ui_fixture_cli
