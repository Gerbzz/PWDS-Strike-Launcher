name: Installer development preview

on:
  push:
    branches: [feature/verified-install-workflow, feature/launcher-preview-recovery-audit, feature/preview-provenance-inventory]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      RUSTFLAGS: -C debuginfo=0 -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Gerbzz/GridStrike
          ref: a4457c872b9fad0b492c30bf585cccfb4d25cd9e
          path: gridstrike-source
      - name: Test preview audit tooling
        shell: pwsh
        run: python -m unittest discover -s tools -p 'test_*.py' -v
      - name: Test launcher install transactions
        shell: pwsh
        run: cargo test --locked --features developer-preview
      - name: Build real GridStrike app on standard Windows runner
        shell: pwsh
        working-directory: gridstrike-source
        run: cargo build --locked -p gridcraft --bin gridstrike
      - name: Build launcher CLI and native UI
        shell: pwsh
        run: cargo build --locked --features native-ui,developer-preview --bins
      - name: Inventory resolved Windows dependencies for notice review
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $audit = Join-Path $env:RUNNER_TEMP 'strike-development-preview'
          New-Item -ItemType Directory -Force -Path $audit | Out-Null
          cargo metadata --locked --format-version 1 --features native-ui,developer-preview --filter-platform x86_64-pc-windows-msvc > (Join-Path $audit 'launcher-metadata.json')
          if ($LASTEXITCODE -ne 0) { throw 'launcher metadata failed' }
          cargo metadata --locked --format-version 1 --filter-platform x86_64-pc-windows-msvc --manifest-path gridstrike-source/Cargo.toml > (Join-Path $audit 'gridstrike-metadata.json')
          if ($LASTEXITCODE -ne 0) { throw 'GridStrike metadata failed' }
          python tools/dependency_inventory.py `
            --launcher-metadata (Join-Path $audit 'launcher-metadata.json') `
            --launcher-lock Cargo.lock `
            --app-metadata (Join-Path $audit 'gridstrike-metadata.json') `
            --app-lock gridstrike-source/Cargo.lock `
            --output (Join-Path $audit 'dependency-inventory.json')
          if ($LASTEXITCODE -ne 0) { throw 'dependency inventory failed' }
          Remove-Item -LiteralPath (Join-Path $audit 'launcher-metadata.json'), (Join-Path $audit 'gridstrike-metadata.json')
      - name: Package pinned development preview and audit PE imports
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/package_preview.py `
            --app gridstrike-source/target/debug/gridstrike.exe `
            --cli target/debug/pwds-strike-launcher.exe `
            --ui target/debug/pwds-strike-launcher-ui.exe `
            --source gridstrike-source `
            --output "$env:RUNNER_TEMP/strike-development-preview" `
            --launcher-commit "$env:GITHUB_SHA" `
            --app-commit a4457c872b9fad0b492c30bf585cccfb4d25cd9e `
            --dependency-inventory "$env:RUNNER_TEMP/strike-development-preview/dependency-inventory.json"
          if ($LASTEXITCODE -ne 0) { throw 'preview packaging or import audit failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-gridstrike-development-preview-${{ github.sha }}
          path: ${{ runner.temp }}/strike-development-preview/
          if-no-files-found: error
          retention-days: 3

  clean-windows-consumer:
    needs: windows-build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      # This job intentionally has no source checkout or compiler/build step.
      - uses: actions/download-artifact@v4
        with:
          name: launcher-gridstrike-development-preview-${{ github.sha }}
          path: ${{ runner.temp }}/strike-preview-consumer
      - name: Verify isolated install, process start, synthetic update, rollback and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $artifact = Join-Path $env:RUNNER_TEMP 'strike-preview-consumer'
          $proof = Get-Content -LiteralPath (Join-Path $artifact 'provenance.json') -Raw | ConvertFrom-Json
          $inventory = Join-Path $artifact $proof.dependency_inventory.name
          if ((Get-Item -LiteralPath $inventory).Length -ne $proof.dependency_inventory.bytes) { throw 'wrong dependency inventory length' }
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $inventory).Hash.ToLowerInvariant() -ne $proof.dependency_inventory.sha256) { throw 'wrong dependency inventory hash' }
          $cli = Join-Path $artifact 'pwds-strike-launcher.exe'
          $root = Join-Path $env:RUNNER_TEMP 'pwds-clean-preview-root'
          foreach ($version in @('0.5.0', '0.5.1')) {
            $package = $proof.packages.$version
            $zip = Join-Path $artifact $package.name
            if ((Get-Item -LiteralPath $zip).Length -ne $package.bytes) { throw "wrong package length: $version" }
            if ((Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant() -ne $package.sha256) { throw "wrong package hash: $version" }
          }
          # The clean runner still has SDKs installed by GitHub. Exclude every developer
          # location from child process search paths; test only the downloaded artifact.
          $env:PATH = "$env:WINDIR\System32;$env:WINDIR"
          foreach ($tool in @('cargo', 'rustc', 'cl', 'gst-launch-1.0')) {
            if (Get-Command $tool -CommandType Application -ErrorAction SilentlyContinue) { throw "developer tool visible on PATH: $tool" }
          }
          $zip0 = Join-Path $artifact $proof.packages.'0.5.0'.name
          $zip1 = Join-Path $artifact $proof.packages.'0.5.1'.name
          & $cli preview-install '0.5.0' $zip0 $root
          if ($LASTEXITCODE -ne 0) { throw 'clean preview install failed' }
          $app = Join-Path $root 'apps/gridstrike/0.5.0/gridstrike.exe'
          & $app --version
          if ($LASTEXITCODE -ne 0) { throw 'installed GridStrike process failed to start' }
          & $cli preview-launch-version $root
          if ($LASTEXITCODE -ne 0) { throw 'launcher process start failed' }
          $marker = Join-Path $root 'user-project.txt'
          Set-Content -LiteralPath $marker -Value 'preserve me'
          & $cli preview-install '0.5.1' $zip1 $root
          if ($LASTEXITCODE -ne 0) { throw 'synthetic update failed' }
          $state = Get-Content -LiteralPath (Join-Path $root 'installed.json') -Raw | ConvertFrom-Json
          if ($state.installed[0].version -ne '0.5.1') { throw 'update receipt was not activated' }
          & $cli preview-rollback $root
          if ($LASTEXITCODE -ne 0) { throw 'rollback failed' }
          $state = Get-Content -LiteralPath (Join-Path $root 'installed.json') -Raw | ConvertFrom-Json
          if ($state.installed[0].version -ne '0.5.0') { throw 'rollback receipt was not activated' }
          & $cli preview-uninstall $root
          if ($LASTEXITCODE -ne 0) { throw 'uninstall failed' }
          if (Test-Path -LiteralPath (Join-Path $root 'apps/gridstrike/0.5.0')) { throw 'old version still installed' }
          if (Test-Path -LiteralPath (Join-Path $root 'apps/gridstrike/0.5.1')) { throw 'new version still installed' }
          if ((Get-Content -LiteralPath $marker -Raw).Trim() -ne 'preserve me') { throw 'user data changed' }
          $result = @{ status='passed'; source_checkout=$false; developer_path=$false; app_process='--version'; update='synthetic transaction fixture'; gui='not exercised on headless runner' }
          $result | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $artifact 'clean-consumer-result.json')
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-clean-consumer-proof-${{ github.sha }}
          path: ${{ runner.temp }}/strike-preview-consumer/clean-consumer-result.json
          if-no-files-found: error
          retention-days: 3

  linux-casefold-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Exercise unowned case-colliding file on a case-sensitive volume
        run: cargo test --locked --features developer-preview --test installer uninstall_refuses_case_colliding_unowned_file -- --exact
