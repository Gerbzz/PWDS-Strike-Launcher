[package]
name = "pwds-strike-launcher"
version = "0.1.0"
edition = "2024"
publish = false
description = "PWDS Strike Launcher source foundation"

[features]
default = []
native-ui = ["dep:eframe", "dep:png"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
eframe = { version = "0.30", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "glow", "x11"], optional = true }
png = { version = "0.17", optional = true }

[[bin]]
name = "pwds-strike-launcher-ui"
path = "src/bin/ui.rs"
required-features = ["native-ui"]
